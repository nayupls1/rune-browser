appId: dev.runebrowser.app
productName: Rune Browser
executableName: rune-browser
copyright: Copyright © 2026 nayupls1
directories:
  output: release
  # icon.png (from icon.svg) for macOS and Linux, icon.ico (from icon.png) for Windows
  buildResources: build
files:
  - package.json
  - dist/electron/**
  - dist/renderer/**
# The compiled Bun server is a native executable, so it lives outside the asar.
extraResources:
  - from: dist/server
    to: server
    filter:
      - rune-server*
      - "!*.map"
# Nothing to rebuild: the main process is bundled, the server compiled.
npmRebuild: false
artifactName: rune-browser-${version}-${os}-${arch}.${ext}
# Cookies (web tab logins) encrypted with the key in the OS keychain.
electronFuses:
  enableCookieEncryption: true
# Releases (and the update feed the app reads, see src/main/updates.ts) are on
# GitHub. CI creates the draft release; electron-builder uploads into it.
publish:
  provider: github
  owner: nayupls1
  repo: rune-browser
  releaseType: draft
linux:
  # The AppImage runs anywhere; the packages install it for Debian and Ubuntu (deb),
  # Fedora and openSUSE (rpm) and Arch (pacman). All of them update themselves.
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  category: Network;WebBrowser
  synopsis: A browser with an agent that customizes and uses websites for you
  maintainer: nayupls1 <316469236+nathanpls@users.noreply.github.com>
  # The window's Wayland app id / WM_CLASS matches the .desktop file (its icon, pinning).
  syncDesktopName: true
  # A browser: offered for links and web files, and can be the default (src/shared/defaultBrowser.ts).
  mimeTypes:
    - text/html
    - application/xhtml+xml
    - application/pdf
    - image/svg+xml
    - image/webp
    - x-scheme-handler/http
    - x-scheme-handler/https
pacman:
  # Electron's libraries as Arch names them (electron-builder's defaults name packages Arch no longer has).
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - libnotify
    - libsecret
    - mesa
win:
  target: nsis
  icon: build/icon.ico
nsis:
  artifactName: rune-browser-${version}-setup-${arch}.${ext}
  # build/installer.nsh registers Rune Browser as a browser (Default apps) and removes that when uninstalled.
mac:
  target:
    - dmg
    # Updates read the zip.
    - zip
  category: public.app-category.productivity
  # A browser: offered for links and web files, and can be the default (src/shared/defaultBrowser.ts).
  # Alternate: it never takes files over from their apps by itself.
  protocols:
    - name: Web site URL
      role: Viewer
      schemes: [http, https]
  fileAssociations:
    - { ext: [html, htm, xhtml, shtml], name: HTML document, role: Viewer, rank: Alternate }
    - { ext: pdf, name: PDF document, role: Viewer, rank: Alternate }
    - { ext: svg, name: SVG image, role: Viewer, rank: Alternate }
    - { ext: webp, name: WebP image, role: Viewer, rank: Alternate }
  # What macOS says when a website in a tab first wants the camera, microphone or location.
  extendInfo:
    NSCameraUsageDescription: Websites you allow can use your camera.
    NSMicrophoneUsageDescription: Websites you allow can use your microphone.
    NSLocationWhenInUseUsageDescription: Websites you allow can know your location.
  # Not signed yet (NAT-89): ad-hoc, so Apple Silicon runs it after "Open anyway".
  identity: "-"
