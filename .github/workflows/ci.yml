# Typecheck, unit tests, build and e2e on every supported OS. Runs on pull
# requests and master, and before every release (release.yml calls it).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is supported but nobody on the team can test it by hand: its
    # failures show up without blocking.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 30
    env:
      # e2e: no agent logins on CI, so providers only need to be detected.
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Linux sandboxes (bubblewrap, user namespaces for it and Chromium)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun run typecheck
      # Flaky failures (a test file, or the e2e run, that passes when run again)
      # don't fail the job, but show as warnings on the run and in its summary.
      - run: bun run test
      - run: bun run build
      - run: bun run e2e --retries 1
        env:
          # Windows runners are several times slower than a developer's machine.
          E2E_TIMEOUT_SCALE: ${{ runner.os == 'Windows' && '2' || '1' }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
