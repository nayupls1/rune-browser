# Typecheck, unit tests, build and e2e on Linux and Windows. Runs on pull
# requests and master, and before every release (release.yml calls it).
# Typecheck, tests and build run in every package (apps/*) through Turborepo;
# e2e is the browser's (apps/browser).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No macOS: nobody on the team can test it by hand, and its runners'
        # flaky failures were noise. Releases still build its installers.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # e2e: no agent logins on CI, so providers only need to be detected.
      CI: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned to a commit (tags can be moved), with the version alongside.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token isn't left in .git/config for later steps.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Linux sandbox (user namespaces for Chromium)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun run typecheck
      # Flaky failures (a test file, or the e2e run, that passes when run again)
      # don't fail the job, but show as warnings on the run and in its summary.
      - run: bun run test
      - run: bun run build
      - run: bun run e2e --retries 1
        env:
          # Windows runners are several times slower than a developer's machine.
          E2E_TIMEOUT_SCALE: ${{ runner.os == 'Windows' && '2' || '1' }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.os }}
          path: apps/browser/test-results/
          if-no-files-found: ignore
          retention-days: 7
