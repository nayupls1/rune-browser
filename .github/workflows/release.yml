# Publishes a release when a version tag (v0.2.0) is pushed, usually by
# `bun run release`, or a daily build of master when started by hand
# (`bun run release --daily`, see docs/releasing.md):
#   1. a draft GitHub release with generated notes (what changed, PR by PR); a
#      daily build's version is the next patch version with the date and this
#      run's number (0.2.1-daily.20261031.42), and its tag is pushed here
#      (tags pushed with the workflow's token don't start another run)
#   2. the full CI checks on every OS
#   3. installers built on each OS and uploaded to the draft by electron-builder,
#      with the update feeds (latest*.yml / daily*.yml) the app reads
#   4. SHA256SUMS.txt, then the draft is published
# Nothing is published unless every step passed; a failed run leaves a draft
# (and the tag) to delete before tagging again.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  prepare:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The version (the tag matches package.json, or the daily build's)
        run: |
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != master ]; then
              echo "::error::Daily builds are of master, not $GITHUB_REF_NAME"
              exit 1
            fi
            # After the next stable release in SemVer order: package.json's
            # version if it isn't released yet, else the patch after it.
            git fetch --quiet --tags origin
            if git rev-parse --quiet --verify "refs/tags/v$version" > /dev/null; then
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
            fi
            version="$version-daily.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
            git tag "v$version" "$GITHUB_SHA"
            git push --quiet origin "v$version"
          elif [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Draft with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A version with a suffix (0.2.1-daily.20261031.42) is a pre-release: only the daily channel gets it.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "Rune Browser $VERSION" $prerelease

  check:
    name: Checks
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.os }})
    needs: [prepare, check]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Set the version
        # A daily build's version is only in its tag; the app and the installers read package.json.
        shell: bash
        run: |
          bun -e 'const f = Bun.file("package.json"); await Bun.write(f, JSON.stringify({ ...(await f.json()), version: process.env.VERSION }, null, 2))'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - run: bun run build
      - name: Package and upload to the draft
        run: bunx electron-builder --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          # No signing certificates yet (NAT-89).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY"
          sha256sum -- * > ../SHA256SUMS.txt
          gh release upload "$TAG" ../SHA256SUMS.txt -R "$GITHUB_REPOSITORY"
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
