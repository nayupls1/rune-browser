# Performance benchmarks (apps/browser/docs/benchmarks.md): Rune Browser against Chrome on the same
# pages, and Rune's UI under stress. Started by hand for any branch (Actions → Benchmarks → Run
# workflow); the report is the run's summary, the data an artifact. GitHub's runners are noisy:
# this is the broad picture, small changes are measured on one's own machine.
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only scenarios whose id contains this ("load|input": either); empty for all'
        required: false
        default: ""
      runs:
        description: "Runs per scenario"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: User namespaces for Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/browser build
      # The runners come with Google Chrome (/usr/bin/google-chrome), which the benchmarks find.
      - run: bun run bench --runs "$RUNS" ${ONLY:+--only "$ONLY"}
        env:
          RUNS: ${{ inputs.runs }}
          ONLY: ${{ inputs.only }}
      - name: Report
        if: always()
        run: cat apps/browser/bench-results/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: apps/browser/bench-results/
          if-no-files-found: ignore
          retention-days: 30
